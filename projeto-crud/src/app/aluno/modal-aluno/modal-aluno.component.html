<div class="modal-header">
    <h4 class="modal-title" id="modal-basic-title">Id do aluno: {{aluno.id}}</h4>
    <button type="button" class="btn-close" aria-label="Close" 
    (click)="activeModal.close()"></button>
</div>
<div class="modal-body">
    <p>Aluno: {{ aluno.nome }}</p>
    <p>Aluno: {{ aluno.cpf }}</p>
    <p>Aluno: {{ aluno.email }}</p>
    <p>Aluno: {{ aluno.dataNascimento}}</p>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-outline-dark" 
    (click)="activeModal.close()">Fechar</button>
</div>
